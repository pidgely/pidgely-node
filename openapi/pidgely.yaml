        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts/{id}/duplicate:
    post:
      tags:
      - Broadcasts
      summary: Duplicate a broadcast as a draft
      operationId: post_broadcasts_id_duplicate
      parameters:
      - name: id

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key `pdg_<prefix>_<secret>`.
  responses:
    Unauthorized:
      description: Missing or restricted credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    Forbidden:
      description: Invalid key, unverified domain, plan limit, CSRF or role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    Invalid:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    TooMany:
      description: Rate limit or quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    Upstream:
      description: The AI service failed or returned an unusable answer (ai_unavailable, ai_busy, ai_timeout, ai_invalid_output)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
  schemas:
    ResendError:
      type: object
      properties:
        statusCode:
          type: integer
        name:
          type: string
          description: Machine-readable error name (validation_error, not_found, missing_api_key, invalid_api_key, restricted_api_key,
            rate_limit_exceeded, daily_quota_exceeded, monthly_quota_exceeded, invalid_idempotent_request, csrf_failed, insufficient_role,
            ...).
        message:
          type: string
      required:
      - statusCode
      - name
      - message
    ObjectId:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
      required:
      - object
      - id
    Id:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    Deleted:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        deleted:
          type: boolean
      required:
      - object
      - id
      - deleted
    Tag:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
        value:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
      required:
      - name
      - value
    Attachment:
      type: object
      properties:
        filename:
          type: string
        content:
          type: string
          description: Base64 content. Use either content or path.
        path:
          type: string
          description: http(s) URL downloaded at send time (SSRF-guarded, 40MB budget, no redirects).
        content_type:
          type: string
        content_id:
          type: string
          description: Makes the attachment inline (`cid:` in HTML).
    TemplateRef:
      type: object
      properties:
        id:
          type: string
          description: Template id or alias (published version is used).
        variables:
          type: object
          additionalProperties:
            oneOf:
            - type: string
              maxLength: 2000
            - type: number
      required:
      - id
    SendEmail:
      type: object
      properties:
        from:
          type: string
          description: '`Name <addr@verified-domain>`; may come from the template.'
        to:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        cc:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        bcc:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        reply_to:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        subject:
          type: string
        html:
          type: string
        text:
          type: string
          description: Generated from html when omitted.
        headers:
          type: object
          additionalProperties:
            type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        scheduled_at:
          type: string
          description: ISO 8601 or natural language (`in 1 hour`, `tomorrow at 9am`); within 30 days.
        template:
          $ref: '#/components/schemas/TemplateRef'
        topic_id:
          type: string
          description: Not supported yet; a non-empty value is rejected.
        stream:
          type: string
          description: 'Pidgely extension: `transactional` (default) or `broadcast` (adds RFC 8058 unsubscribe).'
          enum:
          - transactional
          - broadcast
      required:
      - to
    BatchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: string
      required:
      - data
    Email:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        message_id:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        reply_to:
          type: array
          items:
            type: string
        from:
          type: string
        subject:
          type: string
        html:
          type:
          - string
          - 'null'
        text:
          type:
          - string
          - 'null'
        created_at:
          type: string
          description: Timestamp in Resend format (`2026-10-12 16:44:41.000000+00`).
        scheduled_at:
          type:
          - string
          - 'null'
          description: Timestamp in Resend format, or null.
        last_event:
          type: string
          enum:
          - queued
          - scheduled
          - sent
          - delivered
          - delivery_delayed
          - bounced
          - complained
          - suppressed
          - failed
          - canceled
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    EmailAttachment:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
        content_type:
          type: string
        content_disposition:
          type: string
          enum:
          - attachment
          - inline
        content_id:
          type:
          - string
          - 'null'
        download_url:
          type: string
          description: Signed link, valid for 1 hour.
        expires_at:
          type: string
    DomainRecord:
      type: object
      properties:
        record:
          type: string
          enum:
          - DKIM
          - SPF
          - DMARC
        name:
          type: string
          description: Relative to the domain.
        type:
          type: string
          enum:
          - TXT
          - MX
        ttl:
          type: string
        status:
          type: string
        value:
          type: string
        priority:
          type: integer
    Domain:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - not_started
          - pending
          - verified
          - failed
        created_at:
          type: string
          description: Timestamp in Resend format (`2026-10-12 16:44:41.000000+00`).
        region:
          type: string
        open_tracking:
          type: boolean
        click_tracking:
          type: boolean
        tls:
          type: string
          enum:
          - opportunistic
          - enforced
        capabilities:
          type: object
          properties:
            sending:
              type: string
            receiving:
              type: string
        records:
          type: array
          items:
            $ref: '#/components/schemas/DomainRecord'
    CreateDomain:
      type: object
      properties:
        name:
          type: string
        region:
          type: string
        custom_return_path:
          type: string
          description: Bounce subdomain label (default `bounces`).
        tls:
          type: string
          enum:
          - opportunistic
          - enforced
        open_tracking:
          type: boolean
          description: Accepted, not supported yet (always false).
        click_tracking:
          type: boolean
          description: Accepted, not supported yet.
        capabilities:
          type: object
          properties:
            sending:
              type: string
            receiving:
              type: string
              description: '`enabled` is rejected (receiving not supported yet).'
      required:
      - name
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permission:
          type: string
          enum:
          - full_access
          - sending_access
        created_at:
          type: string
          description: Timestamp in Resend format (`2026-10-12 16:44:41.000000+00`).
        last_used_at:
          type:
          - string
          - 'null'
          description: Timestamp in Resend format, or null.
    CreatedApiKey:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        token:
          type: string
          description: 'Shown once: `pdg_<prefix>_<secret>`.'
    Webhook:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        created_at:
          type: string
          description: Timestamp in Resend format (`2026-10-12 16:44:41.000000+00`).
        status:
          type: string
          enum:
          - enabled
          - disabled
        endpoint:
          type: string
        events:
          type: array
          items:
            type: string
        signing_secret:
          type: string
    Suppression:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        email:
          type: string
        origin:
          type: string
          enum:
          - bounce
          - complaint
          - manual
          - unsubscribe
        source_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          description: Timestamp in Resend format (`2026-10-12 16:44:41.000000+00`).
    ContactInput:
      type: object
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        unsubscribed:
          type: boolean
        properties:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        segments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
            required:
            - id
        topics:
          type: array
          description: Not supported yet.
    Contact:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          description: Timestamp in Resend format (`2026-10-12 16:44:41.000000+00`).
        unsubscribed:
          type: boolean
        properties:
          type: object
          additionalProperties:

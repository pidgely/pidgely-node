  /domains/{id}/dns-provider:
    get:
      tags:
      - Domains
      summary: Detect the DNS provider and automatic setup options
      operationId: get_domains_id_dns_provider
      description: 'Finds the DNS zone that holds the domain (NS lookups from the domain up to its registrable domain) and
        the provider that hosts it.

        `domain_connect` is set when the provider supports Pidgely''s Domain Connect template: open `url` (signed by Pidgely;
        it applies only this domain''s records) and the provider creates the records after the user confirms, then redirects
        to `/domains/connected/` on the dashboard. `cloudflare` is true when the zone is on Cloudflare, so the records can
        be written with an API token (`POST .../dns-provider/cloudflare`). Lookups are bounded (a few seconds at most). 30
        requests per minute per organization.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /domains/{id}/dns-provider/cloudflare:
    post:
      tags:
      - Domains
      summary: Configure the domain's DNS records through the Cloudflare API
      operationId: post_domains_id_dns_provider_cloudflare
      description: 'Creates or updates exactly Pidgely''s records in the domain''s Cloudflare zone with a Cloudflare API token
        (permission Zone → DNS → Edit, plus Zone → Zone → Read to find the zone). Idempotent: running it again changes nothing.
        Unrelated records are never touched; an existing SPF record at the return path gets Pidgely''s `include:` merged in
        (never a second SPF record), and an existing DMARC policy is kept. A DNS check is scheduled right after. The token
        is used for this request only: it is never stored or logged.

        Errors (422, field `api_token`): `cloudflare_invalid_token`, `cloudflare_missing_permission`, `cloudflare_zone_not_found`;
        502 `cloudflare_unavailable`. 10 requests per minute per organization.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
                  description: Cloudflare API token. Used once, never stored.
              required:
              - api_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
        '502':
          description: Cloudflare could not be reached (`cloudflare_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendError'
      security:
      - apiKey: []

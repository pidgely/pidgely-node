      security:
      - apiKey: []
  /broadcasts/{id}/cancel:
    post:
      tags:
      - Broadcasts
      summary: Cancel a scheduled or queued broadcast
      operationId: post_broadcasts_id_cancel
      parameters:
      - name: id
        in: path

openapi: 3.1.0
info:
  title: Pidgely API (public subset)
  version: 1.0.0
  summary: Resend-compatible email API.
  description: 'Public, Resend-compatible subset of the Pidgely API used to generate the types of the `pidgely` SDK. Errors
    have the shape `{"statusCode","name","message"}`. List endpoints use cursor pagination: `limit` (1-100), `after` and `before`
    take item ids and the response is `{"object":"list","has_more","data"}`.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.pidgely.com
tags:
- name: API keys
- name: Audiences (legacy)
- name: Broadcasts
- name: Contacts
- name: Domains
- name: Emails
- name: Native API (v1)
- name: Segments
- name: Suppressions
- name: Template builder
- name: Templates
- name: Webhooks
paths:
  /api-keys:
    post:
      tags:
      - API keys
      summary: Create an API key
      operationId: post_api_keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permission:
                  type: string
                  enum:
                  - full_access
                  - sending_access
                domain_id:
                  type: string
                  format: uuid
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - API keys
      summary: List API keys
      operationId: get_api_keys
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /api-keys/{id}:
    patch:
      tags:
      - API keys
      summary: Rename an API key
      operationId: patch_api_keys_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - API keys
      summary: Revoke an API key
      operationId: delete_api_keys_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences:
    post:
      tags:
      - Audiences (legacy)
      summary: Create a audience
      operationId: post_audiences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - Audiences (legacy)
      summary: List audiences
      operationId: get_audiences
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Segment'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences/{id}:
    get:
      tags:
      - Audiences (legacy)
      summary: Retrieve a audience
      operationId: get_audiences_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - Audiences (legacy)
      summary: Delete a audience
      operationId: delete_audiences_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences/{id}/contacts:
    get:
      tags:
      - Audiences (legacy)
      summary: List a audience's contacts
      operationId: get_audiences_id_contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    post:
      tags:
      - Audiences (legacy)
      summary: Create a contact in an audience
      operationId: post_audiences_id_contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences/{id}/contacts/{key}:
    get:
      tags:
      - Audiences (legacy)
      summary: Retrieve a contact
      operationId: get_audiences_id_contacts_key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    patch:
      tags:
      - Audiences (legacy)
      summary: Update a contact
      operationId: patch_audiences_id_contacts_key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - Audiences (legacy)
      summary: Delete a contact
      operationId: delete_audiences_id_contacts_key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  contact:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /brand/import:
    post:
      tags:
      - Templates
      summary: Import brand from website (Pidgely extension)
      operationId: post_brand_import
      description: 'Scale plan (403 `plan_required` otherwise). Fetches the website (public addresses only, every redirect
        re-checked, bounded sizes and timeouts) and proposes a builder theme and brand profile: logo candidates (stored and
        served from `/files/brand/...` so e-mails get absolute URLs), a palette ranked into roles with WCAG-checked button
        and link colors, fonts mapped to e-mail-safe stacks with Google Fonts, the company name, social profiles and postal
        address. With AI assist configured and included in the plan, Claude picks among the extracted candidates (it never
        sees the page); the heuristic result stands on its own. Nothing is saved unless `apply` is true. At most 6 imports
        per minute per organization.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Website address (`acme.com` or `https://acme.com`). Defaults to the root site of the first
                    verified sending domain.
                  examples:
                  - https://acme.com
                apply:
                  type: boolean
                  default: false
                  description: Save the proposed theme and brand profile as the organization's builder defaults.
                ai:
                  type: boolean
                  default: true
                  description: Let AI assist choose among the candidates when available (counts against the monthly AI quota).
                language:
                  type: string
                  description: Language of the AI rationale (BCP 47, e.g. `en`, `pt-br`, `es`). Default English.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'Validation error: `brand_url_forbidden` (private or internal address, port other than 80/443) or `brand_fetch_failed`
            (unreachable, non-HTML, HTTP error, timeout)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendError'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts:
    post:
      tags:
      - Broadcasts
      summary: Create a broadcast (optionally send)
      operationId: post_broadcasts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - Broadcasts
      summary: List broadcasts
      operationId: get_broadcasts
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Broadcast'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts/{id}:
    get:
      tags:
      - Broadcasts
      summary: Retrieve a broadcast
      operationId: get_broadcasts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    patch:
      tags:
      - Broadcasts
      summary: Update a draft broadcast
      operationId: patch_broadcasts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - Broadcasts
      summary: Delete a broadcast
      operationId: delete_broadcasts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
